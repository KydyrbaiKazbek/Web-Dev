<!DOCTYPE html>

<html>
    <head>
        <title>Instagram Login</title>
        <link rel="stylesheet" href="login.css">
    
    </head>
    <body>
        <main>
            <div id="left">
                <img id="corner-logo" src="/Lab2/Task2 Instagram/instagram-logo.jpg" alt="Instagram logo">
                <h1>Посмотрите, какими <br>моментами из жизни<br>поделились ваши <span id="highlight">близкие друзья</span>.</h1>
                <div id="phone-app-interface">
                    <img src="/Lab2/Task2 Instagram/img.png" alt="Phone">
                </div>
            </div>
            <div id="right">
                <div id="login-box">
                    <h2>Войти в Instagram</h2>
                    <form>
                        <input type="text" placeholder="Имя пользователя, телефон или эл. адрес" required>
                        <input type="password" placeholder="Пароль" required>

                        <button type="submit" id="login-btn">Войти</button>
                        <a href="#" id="forgot-p">Забыли пароль?</a>
                        <button type="button" id="facebook-btn">Войти через Facebook</button>
                        <button type="button" id="sign-up-btn">Создать новый аккаунт</button>
                    </form>
                    <div id="meta-text">∞ Meta</div>
                </div>
            </div>
        </main>
    </body>
</html>
