<!DOCTYPE html>

<html>
    <head>
        <title>Facebook — Выполните вход или зарегистрируйтесь</title>
        <link rel="icon" type="image/x-icon" href="/Lab2/Task1 Facebook/src/facebook icon.png">
        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <main class="container">
            <div id="left">
                <img id="logo" src="/Lab2/Task1 Facebook/src/facebook-full-logo.svg" width = 320 alt = "Facebook">
                <p>Facebook помогает вам всегда <br> оставаться на связи и общаться со <br>своими знакомыми.</p>
            </div>
            <div id="right">
                <form action="">
                    <input type="text" placeholder="Электронный адрес или номер телефона" required>
                    <input type="password" placeholder="Пароль" required>
                    <button type="submit" id="sign-in">Вход</button>
                    <a href="https://..." id="forgot-p">Забыли пароль?</a>
                    <hr>
                    <button type="button" id="sign-up">Создать новый акканут</button>
                </form>
                <p id="extra-text"><strong>Создать Страницу</strong> знаменитости, музыкальной группы или <br> компании.</p>
            </div>
        </main>
    </body>
</html>
